# 原生后端模板：PostGIS + GeoServer。仅回环，不暴露公网。
# 状态：未在本机验证（Docker 守护进程未运行）。镜像 tag 属占位，请按官方当前版本核对。
# 用法：docker compose -f deploy/backends/docker-compose.template.yml up -d
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: "${POSTGIS_PASSWORD:?set POSTGIS_PASSWORD in your local shell, never commit it}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_PASSWORD:?set GEOSERVER_PASSWORD in your local shell}"
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis-data:
